<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Serviços</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #222;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input, select, textarea, button {
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
        }

        .campo-completo {
            grid-column: 1 / 3;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f3f5;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔧 Controle de Serviços</h1>

    <div class="card">
        <h2>Novo Serviço</h2>

        <div class="form-grid">

            <input id="cliente" placeholder="Nome do cliente">

            <input id="equipamento" placeholder="Equipamento">

            <input id="problema" placeholder="Problema">

            <input id="responsavel" placeholder="Responsável">

            <select id="status">
                <option>Aguardando diagnóstico</option>
                <option>Em diagnóstico</option>
                <option>Aguardando aprovação</option>
                <option>Em manutenção</option>
                <option>Pronto</option>
                <option>Entregue</option>
            </select>

            <input id="valor" type="number" step="0.01" placeholder="Valor">

            <textarea
                    id="observacoes"
                    class="campo-completo"
                    placeholder="Observações">
            </textarea>

            <button
                    class="campo-completo"
                    onclick="criarServico()">
                Cadastrar Serviço
            </button>

        </div>
    </div>

    <div class="card">

        <h2>Serviços cadastrados</h2>

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Equipamento</th>
                <th>Problema</th>
                <th>Status</th>
                <th>Valor</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody id="listaServicos">
            </tbody>

        </table>

    </div>

</div>

<script>

    async function carregarServicos() {

        const resposta = await fetch('/servicos');

        const servicos = await resposta.json();

        const tabela = document.getElementById('listaServicos');

        tabela.innerHTML = '';

        servicos.forEach(servico => {

            tabela.innerHTML += `
            <tr>
                <td>${servico.id}</td>
                <td>${servico.cliente}</td>
                <td>${servico.equipamento}</td>
                <td>${servico.problema}</td>
                <td>${servico.status}</td>
                <td>R$ ${servico.valor}</td>
<td>
    <button onclick="editarServico(${servico.id})">
        Editar
    </button>

    <button onclick="excluirServico(${servico.id})">
        Excluir
    </button>
</td>
            </tr>
        `;

        });
    }


    async function criarServico() {

        const servico = {

            cliente: document.getElementById('cliente').value,

            equipamento: document.getElementById('equipamento').value,

            problema: document.getElementById('problema').value,

            dataEntrada: new Date()
                .toISOString()
                .slice(0, 19),

            responsavel: document
                .getElementById('responsavel')
                .value,

            status: document
                .getElementById('status')
                .value,

            valor: Number(
                document.getElementById('valor').value || 0
            ),

            observacoes: document
                .getElementById('observacoes')
                .value
        };


        await fetch('/servicos', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify(servico)

        });


        alert('Serviço cadastrado com sucesso!');


        document.querySelectorAll('input, textarea').forEach(campo => {
            campo.value = '';
        });


        carregarServicos();
    }


    async function excluirServico(id) {

        const confirmar = confirm(
            'Tem certeza que deseja excluir este serviço?'
        );

        if (!confirmar) {
            return;
        }


        await fetch(`/servicos/${id}`, {
            method: 'DELETE'
        });


        alert('Serviço excluído com sucesso!');


        carregarServicos();
    }
    async function editarServico(id) {

        const cliente = prompt("Nome do cliente:");
        if (cliente === null) return;

        const equipamento = prompt("Equipamento:");
        if (equipamento === null) return;

        const problema = prompt("Problema:");
        if (problema === null) return;

        const status = prompt("Status:");
        if (status === null) return;

        const valor = prompt("Valor:");
        if (valor === null) return;

        const observacoes = prompt("Observações:");
        if (observacoes === null) return;

        const servico = {
            cliente: cliente,
            equipamento: equipamento,
            problema: problema,
            status: status,
            valor: Number(valor),
            observacoes: observacoes
        };

        await fetch(`/servicos/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(servico)
        });

        alert("Serviço atualizado com sucesso!");

        carregarServicos();
    }


    carregarServicos();

</script>

</body>
</html>
