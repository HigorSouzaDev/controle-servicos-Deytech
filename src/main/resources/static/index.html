<!DOCTYPE html>

<html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Serviços</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* CABEÇALHO */

        .header {
            background: #111827;
            color: white;
            padding: 22px 30px;
        }

        .header-content {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 25px;
        }

        .logo-area p {
            margin: 5px 0 0;
            color: #9ca3af;
            font-size: 14px;
        }

        .header-badge {
            background: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        /* CONTAINER */

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* CARDS */

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .stat-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }

        /* CARDS PRINCIPAIS */

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .card-header span {
            color: #6b7280;
            font-size: 13px;
        }

        /* FORMULÁRIO */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .campo label {
            font-size: 13px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .campo-completo {
            grid-column: 1 / 3;
        }

        /* BOTÃO */

        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        /* TABELA */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #f9fafb;
            color: #6b7280;
            font-size: 12px;
            text-transform: uppercase;
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 14px 13px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        tr:hover {
            background: #f9fafb;
        }

        /* STATUS */

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            background: #e5e7eb;
            color: #374151;
        }

        /* BOTÕES DA TABELA */

        .btn-edit,
        .btn-delete {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 4px;
        }

        .btn-edit {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .btn-delete {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-edit:hover {
            background: #bfdbfe;
        }

        .btn-delete:hover {
            background: #fecaca;
        }

        /* RESPONSIVO */

        @media (max-width: 800px) {

            .dashboard {
                grid-template-columns: 1fr 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .campo-completo {
                grid-column: 1;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }

        @media (max-width: 500px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

            .container {
                margin-top: 20px;
                padding: 0 12px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>

</head>

<body>

<header class="header">

    <div class="header-content">

        <div class="logo-area">
            <h1>🔧 Controle de Serviços</h1>
            <p>Gerenciamento de assistência técnica</p>
        </div>

        <div class="header-badge">
            Sistema Online
        </div>

    </div>

</header>

<main class="container">

    <!-- DASHBOARD -->

    <section class="dashboard">

        <div class="stat-card">
            <div class="stat-title">Total de serviços</div>
            <div class="stat-number" id="totalServicos">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Em diagnóstico</div>
            <div class="stat-number" id="emDiagnostico">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Em manutenção</div>
            <div class="stat-number" id="emManutencao">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Prontos</div>
            <div class="stat-number" id="prontos">0</div>
        </div>

    </section>


    <!-- NOVO SERVIÇO -->

    <section class="card">

        <div class="card-header">

            <div>
                <h2>Novo serviço</h2>
                <span>Cadastre um novo atendimento</span>
            </div>

        </div>


        <div class="form-grid">

            <div class="campo">
                <label>Cliente</label>
                <input id="cliente" placeholder="Nome do cliente">
            </div>

            <div class="campo">
                <label>Equipamento</label>
                <input id="equipamento" placeholder="Ex: Notebook Dell">
            </div>

            <div class="campo">
                <label>Problema</label>
                <input id="problema" placeholder="Problema relatado">
            </div>

            <div class="campo">
                <label>Responsável</label>
                <input id="responsavel" placeholder="Responsável pelo atendimento">
            </div>

            <div class="campo">
                <label>Status</label>

                <select id="status">

                    <option>Aguardando diagnóstico</option>
                    <option>Em diagnóstico</option>
                    <option>Aguardando aprovação</option>
                    <option>Em manutenção</option>
                    <option>Pronto</option>
                    <option>Entregue</option>

                </select>

            </div>

            <div class="campo">
                <label>Valor</label>
                <input
                        id="valor"
                        type="number"
                        step="0.01"
                        placeholder="R$ 0,00">
            </div>

            <div class="campo campo-completo">

                <label>Observações</label>

                <textarea
                        id="observacoes"
                        placeholder="Informações adicionais sobre o serviço">
            </textarea>

            </div>

            <div class="campo-completo">

                <button
                        class="btn-primary"
                        onclick="criarServico()">

                    + Cadastrar Serviço

                </button>

            </div>

        </div>

    </section>


    <!-- LISTA -->

    <section class="card">

        <div class="card-header">

            <div>
                <h2>Serviços cadastrados</h2>
                <span>Gerencie os atendimentos da assistência</span>
            </div>

        </div>


        <div class="table-container">

            <table>

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Equipamento</th>
                    <th>Problema</th>
                    <th>Status</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>

                </thead>

                <tbody id="listaServicos"></tbody>

            </table>

        </div>

    </section>

</main>

<script> async function carregarServicos() { const resposta = await fetch('/servicos'); const servicos = await resposta.json(); const tabela = document.getElementById('listaServicos'); tabela.innerHTML = ''; let diagnostico = 0; let manutencao = 0; let prontos = 0; servicos.forEach(servico => { if (servico.status === 'Em diagnóstico') { diagnostico++; } if (servico.status === 'Em manutenção') { manutencao++; } if (servico.status === 'Pronto') { prontos++; } tabela.innerHTML += ` <tr> <td><strong>#${servico.id}</strong></td> <td>${servico.cliente || '-'}</td> <td>${servico.equipamento || '-'}</td> <td>${servico.problema || '-'}</td> <td> <span class="status"> ${servico.status || '-'} </span> </td> <td> R$ ${Number(servico.valor || 0).toFixed(2)} </td> <td> <button class="btn-edit" onclick="editarServico(${servico.id})"> Editar </button> <button class="btn-delete" onclick="excluirServico(${servico.id})"> Excluir </button> </td> </tr> `; }); document.getElementById('totalServicos').textContent = servicos.length; document.getElementById('emDiagnostico').textContent = diagnostico; document.getElementById('emManutencao').textContent = manutencao; document.getElementById('prontos').textContent = prontos; } async function criarServico() { const servico = { cliente: document.getElementById('cliente').value, equipamento: document.getElementById('equipamento').value, problema: document.getElementById('problema').value, dataEntrada: new Date().toISOString().slice(0, 19), responsavel: document.getElementById('responsavel').value, status: document.getElementById('status').value, valor: Number( document.getElementById('valor').value || 0 ), observacoes: document.getElementById('observacoes').value }; if (!servico.cliente || !servico.equipamento) { alert('Informe o cliente e o equipamento.'); return; } await fetch('/servicos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(servico) }); alert('Serviço cadastrado com sucesso!'); document.querySelectorAll('input, textarea').forEach(campo => { campo.value = ''; }); carregarServicos(); } async function editarServico(id) { const cliente = prompt('Nome do cliente:'); if (cliente === null) return; const equipamento = prompt('Equipamento:'); if (equipamento === null) return; const problema = prompt('Problema:'); if (problema === null) return; const status = prompt('Status:'); if (status === null) return; const valor = prompt('Valor:'); if (valor === null) return; const observacoes = prompt('Observações:'); if (observacoes === null) return; const servico = { cliente: cliente, equipamento: equipamento, problema: problema, status: status, valor: Number(valor), observacoes: observacoes }; await fetch(`/servicos/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(servico) }); alert('Serviço atualizado com sucesso!'); carregarServicos(); } async function excluirServico(id) { const confirmar = confirm( 'Tem certeza que deseja excluir este serviço?' ); if (!confirmar) return; await fetch(`/servicos/${id}`, { method: 'DELETE' }); alert('Serviço excluído com sucesso!'); carregarServicos(); } carregarServicos(); </script>

</body> </html>
