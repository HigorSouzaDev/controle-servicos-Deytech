<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Serviços - DeyTech </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 850px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; }
        .logo img { max-width: 150px; }
        h1 { text-align: center; color: #222; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
        textarea { min-height: 70px; resize: vertical; }
        .full { grid-column: 1 / -1; }
        button {
            padding: 10px 14px;
            border: none;
            background-color: #000;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #333; }
        .primary { width: 100%; margin-bottom: 20px; }
        ul { list-style: none; padding: 0; }
        li {
            background-color: #f8f9fa;
            margin-top: 10px;
            padding: 14px;
            border-radius: 5px;
            border-left: 4px solid #000;
        }
        .service-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }
        .service-title { font-weight: bold; }
        .status {
            padding: 5px 8px;
            border-radius: 12px;
            background: #ddd;
            font-size: 12px;
        }
        .service-info { margin-top: 8px; color: #444; line-height: 1.5; }
        .actions { margin-top: 10px; }
        .actions button { margin-right: 5px; }
        .complete-btn { background-color: #28a745; }
        .delete-btn { background-color: #dc3545; }
        .edit-btn { background-color: #555; }
        .search {
            margin: 15px 0;
        }
        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
        @media (max-width: 650px) {
            .container { margin: 10px; padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .full { grid-column: auto; }
            .service-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <img src="logo.png" alt="Logo DeyTech" onerror="this.style.display='none'">
    </div>

    <h1>Controle de Serviços - DeyTech </h1>

    <div class="form-grid">
        <input type="text" id="cliente" placeholder="Nome do cliente">
        <input type="text" id="equipamento" placeholder="Equipamento (ex.: Notebook Dell)">
        <input type="text" id="problema" class="full" placeholder="Problema ou serviço solicitado">
        <input type="date" id="dataEntrada">
        <input type="text" id="responsavel" placeholder="Técnico responsável">
        <select id="status">
            <option>Recebido</option>
            <option>Em diagnóstico</option>
            <option>Aguardando aprovação</option>
            <option>Em manutenção</option>
            <option>Finalizado</option>
            <option>Entregue</option>
        </select>
        <input type="number" id="valor" step="0.01" min="0" placeholder="Valor do serviço (R$)">
        <textarea id="observacoes" class="full" placeholder="Observações"></textarea>
    </div>

    <button class="primary" onclick="salvarServico()">Adicionar serviço</button>

    <input class="search" type="text" id="busca" placeholder="Pesquisar por cliente ou equipamento..." oninput="renderServicos()">

    <ul id="serviceList"></ul>
</div>

<footer>
    © 2026 Nova Opção Tecnologia - Controle de Serviços
</footer>

<script>
let servicos = JSON.parse(localStorage.getItem('servicos')) || [];
let editandoId = null;

document.getElementById('dataEntrada').valueAsDate = new Date();

function salvarDados() {
    localStorage.setItem('servicos', JSON.stringify(servicos));
}

function limparFormulario() {
    document.getElementById('cliente').value = '';
    document.getElementById('equipamento').value = '';
    document.getElementById('problema').value = '';
    document.getElementById('dataEntrada').valueAsDate = new Date();
    document.getElementById('responsavel').value = '';
    document.getElementById('status').value = 'Recebido';
    document.getElementById('valor').value = '';
    document.getElementById('observacoes').value = '';
    editandoId = null;
    document.querySelector('.primary').innerText = 'Adicionar serviço';
}

function salvarServico() {
    const cliente = document.getElementById('cliente').value.trim();
    const equipamento = document.getElementById('equipamento').value.trim();
    const problema = document.getElementById('problema').value.trim();

    if (!cliente || !equipamento || !problema) {
        alert('Preencha cliente, equipamento e problema/serviço.');
        return;
    }

    const dados = {
        cliente,
        equipamento,
        problema,
        dataEntrada: document.getElementById('dataEntrada').value,
        responsavel: document.getElementById('responsavel').value.trim(),
        status: document.getElementById('status').value,
        valor: document.getElementById('valor').value,
        observacoes: document.getElementById('observacoes').value.trim()
    };

    if (editandoId !== null) {
        const index = servicos.findIndex(s => s.id === editandoId);
        if (index !== -1) servicos[index] = { ...servicos[index], ...dados };
    } else {
        servicos.push({ id: Date.now(), ...dados });
    }

    salvarDados();
    limparFormulario();
    renderServicos();
}

function editarServico(id) {
    const s = servicos.find(item => item.id === id);
    if (!s) return;

    document.getElementById('cliente').value = s.cliente;
    document.getElementById('equipamento').value = s.equipamento;
    document.getElementById('problema').value = s.problema;
    document.getElementById('dataEntrada').value = s.dataEntrada;
    document.getElementById('responsavel').value = s.responsavel || '';
    document.getElementById('status').value = s.status;
    document.getElementById('valor').value = s.valor || '';
    document.getElementById('observacoes').value = s.observacoes || '';

    editandoId = id;
    document.querySelector('.primary').innerText = 'Salvar alterações';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function excluirServico(id) {
    if (!confirm('Deseja realmente excluir este serviço?')) return;
    servicos = servicos.filter(s => s.id !== id);
    salvarDados();
    renderServicos();
}

function alterarStatus(id) {
    const s = servicos.find(item => item.id === id);
    if (!s) return;
    const status = ['Recebido','Em diagnóstico','Aguardando aprovação','Em manutenção','Finalizado','Entregue'];
    const atual = status.indexOf(s.status);
    s.status = status[(atual + 1) % status.length];
    salvarDados();
    renderServicos();
}

function formatarData(data) {
    if (!data) return '-';
    const partes = data.split('-');
    return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : data;
}

function renderServicos() {
    const lista = document.getElementById('serviceList');
    const busca = document.getElementById('busca').value.toLowerCase().trim();

    const filtrados = servicos.filter(s =>
        s.cliente.toLowerCase().includes(busca) ||
        s.equipamento.toLowerCase().includes(busca)
    );

    lista.innerHTML = '';

    if (filtrados.length === 0) {
        lista.innerHTML = '<div class="empty">Nenhum serviço cadastrado.</div>';
        return;
    }

    filtrados.forEach(s => {
        const li = document.createElement('li');
        li.innerHTML = `
            <div class="service-header">
                <span class="service-title">${escapeHtml(s.cliente)} - ${escapeHtml(s.equipamento)}</span>
                <span class="status">${escapeHtml(s.status)}</span>
            </div>
            <div class="service-info">
                <b>Problema/Serviço:</b> ${escapeHtml(s.problema)}<br>
                <b>Entrada:</b> ${formatarData(s.dataEntrada)}
                ${s.responsavel ? `<br><b>Responsável:</b> ${escapeHtml(s.responsavel)}` : ''}
                ${s.valor ? `<br><b>Valor:</b> R$ ${Number(s.valor).toFixed(2).replace('.', ',')}` : ''}
                ${s.observacoes ? `<br><b>Observações:</b> ${escapeHtml(s.observacoes)}` : ''}
            </div>
            <div class="actions">
                <button class="complete-btn" onclick="alterarStatus(${s.id})">Alterar status</button>
                <button class="edit-btn" onclick="editarServico(${s.id})">Editar</button>
                <button class="delete-btn" onclick="excluirServico(${s.id})">Excluir</button>
            </div>
        `;
        lista.appendChild(li);
    });
}

function escapeHtml(text) {
    return String(text || '').replace(/[&<>"']/g, c => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
    }[c]));
}

renderServicos();
</script>
</body>
</html>
